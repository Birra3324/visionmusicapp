name: App Store Connect key check

# Fast, read-only check of the three Apple signing secrets.
# Prints shapes and pass/fail only; never prints a secret value.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/asc-key-check

permissions:
  contents: read

jobs:
  check:
    name: Check Apple API key secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Shape of each secret
        run: |
          fail=0
          if [ -z "$ASC_KEY_ID" ]; then echo "::error::ASC_KEY_ID is empty"; fail=1
          elif printf '%s' "$ASC_KEY_ID" | grep -Eq '^[A-Z0-9]{10}$'; then echo "ASC_KEY_ID: OK (10 letters/digits)"
          else echo "::error::ASC_KEY_ID has the wrong shape: ${#ASC_KEY_ID} characters. Expected the 10-character Key ID."; fail=1; fi
          if [ -z "$ASC_ISSUER_ID" ]; then echo "::error::ASC_ISSUER_ID is empty"; fail=1
          elif printf '%s' "$ASC_ISSUER_ID" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then echo "ASC_ISSUER_ID: OK (looks like an issuer ID)"
          else echo "::error::ASC_ISSUER_ID has the wrong shape: ${#ASC_ISSUER_ID} characters. Expected 36 characters with dashes."; fail=1; fi
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::ASC_KEY_P8 is empty"; fail=1
          else
            lines=$(printf '%s\n' "$ASC_KEY_P8" | wc -l | tr -d ' ')
            echo "ASC_KEY_P8: ${#ASC_KEY_P8} characters, $lines lines"
            printf '%s' "$ASC_KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----' && echo "  has BEGIN line" || { echo "::error::ASC_KEY_P8 has no -----BEGIN PRIVATE KEY----- line"; fail=1; }
            printf '%s' "$ASC_KEY_P8" | grep -q -- '-----END PRIVATE KEY-----' && echo "  has END line" || { echo "::error::ASC_KEY_P8 has no -----END PRIVATE KEY----- line"; fail=1; }
          fi
          exit $fail

      - name: Private key parses
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          if openssl pkey -in "$RUNNER_TEMP/key.p8" -noout 2>/dev/null; then echo "Private key: valid"; else echo "::error::ASC_KEY_P8 is not a valid private key file. Paste the whole .p8 file again."; rm -f "$RUNNER_TEMP/key.p8"; exit 1; fi

      - name: Apple accepts the key (read-only call)
        run: |
          pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, jwt
          key = open(os.path.join(os.environ['RUNNER_TEMP'], 'key.p8')).read()
          now = int(time.time())
          token = jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'}, key, algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'})
          req = urllib.request.Request('https://api.appstoreconnect.apple.com/v1/apps?limit=20&fields[apps]=name,bundleId', headers={'Authorization': 'Bearer ' + token})
          try:
              data = json.load(urllib.request.urlopen(req, timeout=30))
              print('Apple accepted the key. Apps visible to it:')
              for a in data.get('data', []):
                  print('  -', a['attributes'].get('name'), '|', a['attributes'].get('bundleId'))
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', 'replace')[:600]
              print(f'::error::Apple rejected the key: HTTP {e.code}. {body}')
              raise SystemExit(1)
          PY

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/key.p8"
