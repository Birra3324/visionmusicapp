name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        # fatal-infos defaults to on. Info-level lints stay visible and do not fail CI.
        # Warnings and errors still fail the job.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Test live catalog configuration
        run: flutter test test/catalog_loader_test.dart --dart-define=USE_FIREBASE_CATALOG=true --dart-define=FALLBACK_TO_LOCAL_CATALOG=false
