name: iOS validation and optional TestFlight upload

# Default: test and build an unsigned iOS app; no Apple secrets or upload.
# Upload requires the explicit input and the app-store environment approval.
# Configure required reviewers on app-store before approving a release.
#
# Run it by hand from the Actions tab (or `gh workflow run ios-release.yml`).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID      - App Store Connect API key ID
#   ASC_ISSUER_ID   - App Store Connect API issuer ID
#   ASC_KEY_P8      - full contents of the AuthKey_XXXX.p8 file
# The API key needs the Admin role so Xcode can create the distribution
# certificate and provisioning profile automatically.

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload only after Birra has approved this release
        type: boolean
        default: false
        required: true
      use_firebase_catalog:
        description: Use the published Firebase catalog instead of demo songs
        type: boolean
        default: true
        required: true
      ref:
        description: Branch, tag or commit to build
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build without signing or uploading
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --dart-define=USE_FIREBASE_CATALOG=${{ inputs.use_firebase_catalog }} --dart-define=FALLBACK_TO_LOCAL_CATALOG=false
      - name: Unsigned iOS build
        run: flutter build ios --release --no-codesign --dart-define=USE_FIREBASE_CATALOG=${{ inputs.use_firebase_catalog }} --dart-define=FALLBACK_TO_LOCAL_CATALOG=false

  testflight:
    if: ${{ inputs.upload_to_testflight == true }}
    needs: validate
    environment: app-store
    name: Approved TestFlight upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Always higher than any build number uploaded by hand (last manual: 8).
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check signing secrets are present
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          exit $missing

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install approved-release symbol tooling
        run: dart pub global activate flutterfire_cli 1.5.0

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Prepare iOS build (no signing)
        run: |
          flutter build ios --release --no-codesign \
            --build-number="$((BUILD_NUMBER + 100))" \
            --dart-define=USE_FIREBASE_CATALOG=${{ inputs.use_firebase_catalog }} \
            --dart-define=FALLBACK_TO_LOCAL_CATALOG=false

      - name: Archive
        env:
          VM_UPLOAD_CRASHLYTICS_SYMBOLS: "true"
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
