<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Discover Oromo artists, albums, songs, and music videos with Vision Music.">
  <meta name="theme-color" content="#0B0806">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vision Music">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vision Music</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b0806; color: #f5f1e8; font-family: system-ui, sans-serif; }
    #app-loading { min-height: 100vh; display: grid; align-content: center; justify-items: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
    #app-loading h1, #app-loading p { margin: 0; max-width: 36rem; }
    #loading-retry { background: #e4bc63; color: #171109; font: inherit; border: 0; border-radius: 12px; padding: 14px 24px; min-height: 48px; cursor: pointer; }
  </style>
</head>
<body>
  <main id="app-loading" aria-live="polite">
    <h1>Vision Music</h1>
    <p id="loading-status">Opening Vision Music…</p>
    <button id="loading-retry" type="button" hidden>Retry</button>
  </main>
  <script src="loading.js"></script>
  <script src="flutter_bootstrap.js" async onerror="window.visionLoadingFailed?.()"></script>
</body>
</html>
